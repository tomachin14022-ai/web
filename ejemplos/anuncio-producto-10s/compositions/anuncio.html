  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Posiciones del producto (la caja de 960x640 escala desde su centro).
    // Antes: alineado exacto con la foto. B: héroe al centro. C/D: arriba, más chico.
    const P_A = { x: 0, y: 0, scale: 1 };
    const P_B = { x: -3.5, y: -59, scale: 1.6 };
    const P_C = { x: -66.7, y: -479.6, scale: 1.15 };
    const P_D = { x: -67.7, y: -487.4, scale: 1.1 };

    // Estado inicial (cuadro 0: el gancho ya está en pantalla)
    tl.set("#ad-prod", P_A, 0);
    tl.set("#ad-ground", { backgroundColor: "#0e1013" }, 0);
    tl.set("#ad-sheen-bar", { x: -260, skewX: -18 }, 0);
    tl.set("#d-cta-sheen", { x: -200, skewX: -18 }, 0);
    tl.set("#ad-ring", { x: 0, y: 0, scale: 1, rotation: 0 }, 0);
    tl.set("#ad-glow", { x: 0, y: 0, scale: 1 }, 0);
    tl.set(["#a-chip", "#a-t1", "#a-t2"], { opacity: 1, filter: "blur(0px)" }, 0);
    tl.set("#a-card", { opacity: 1 }, 0);
    tl.set("#a-foto", { filter: "blur(0px)" }, 0);
    tl.set("#ad-prod-img", { filter: "drop-shadow(0px 0px 0px rgba(212,245,60,0))" }, 0);

    // A · escaneo de la foto (0,45–1,2 s)
    tl.set("#a-scan", { opacity: 0, x: 0 }, 0);
    tl.to("#a-scan", { opacity: 1, duration: 0.06 }, 0.45);
    tl.to("#a-scan", { x: 832, duration: 0.72, ease: "power1.inOut" }, 0.45);
    tl.to("#a-scan", { opacity: 0, duration: 0.08 }, 1.17);
    // el producto se "detecta": contorno lima
    tl.to(
      "#ad-prod-img",
      { filter: "drop-shadow(0px 0px 16px rgba(212,245,60,0.95))", duration: 0.25, ease: "power2.out" },
      0.95,
    );

    // Salida del texto "antes"
    tl.to(
      ["#a-chip", "#a-t1", "#a-t2"],
      { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.05 },
      1.15,
    );

    // A→B · la foto se va, el producto queda, el fondo cambia de color
    tl.to("#a-foto", { filter: "blur(14px)", duration: 0.4, ease: "power2.in" }, 1.25);
    tl.to("#a-card", { opacity: 0, duration: 0.4, ease: "power2.in" }, 1.25);
    tl.to("#ad-ground", { backgroundColor: "#14213d", duration: 0.45, ease: "power2.inOut" }, 1.25);
    tl.to(
      "#ad-prod-img",
      { filter: "drop-shadow(0px 0px 0px rgba(212,245,60,0))", duration: 0.5, ease: "power2.out" },
      1.5,
    );
    tl.to("#ad-prod", { ...P_B, duration: 0.9, ease: "power4.out" }, 1.45);
    tl.to("#ad-shadow", { opacity: 1, duration: 0.45, ease: "power2.out" }, 1.65);
    tl.to("#ad-glow", { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.55);
    tl.to("#ad-ring", { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.6);
    // giro lento y constante del aro de fondo
    tl.to("#ad-ring", { rotation: 34, duration: 8.4, ease: "none" }, 1.6);

    // B · título palabra por palabra
    ["#b-w1", "#b-w2", "#b-w3", "#b-w4"].forEach((sel, i) => {
      tl.fromTo(
        sel,
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" },
        2.05 + i * 0.09,
      );
    });
    // brillo que cruza el producto
    tl.to("#ad-sheen-bar", { x: 1000, duration: 0.75, ease: "power2.inOut" }, 3.1);
    // salida del título
    tl.to(
      ["#b-w1", "#b-w2", "#b-w3", "#b-w4"],
      { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.04 },
      4.6,
    );

    // B→C · el producto sube y se achica; el aro lo acompaña
    tl.to("#ad-prod", { ...P_C, duration: 0.65, ease: "power2.inOut" }, 4.75);
    tl.to("#ad-ring", { x: -54, y: -445, scale: 0.7, duration: 0.65, ease: "power2.inOut" }, 4.75);
    tl.to("#ad-glow", { x: -54, y: -445, scale: 0.8, duration: 0.65, ease: "power2.inOut" }, 4.75);

    // C · beneficios escalonados
    ["#c-1", "#c-2", "#c-3"].forEach((sel, i) => {
      tl.fromTo(
        sel,
        { opacity: 0, scale: 0.95, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" },
        5.15 + i * 0.16,
      );
    });
    tl.to(
      ["#c-3", "#c-2", "#c-1"],
      { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in", stagger: 0.05 },
      7.25,
    );

    // C→D · ajuste chico del producto para hacer lugar al precio
    tl.to("#ad-prod", { ...P_D, duration: 0.5, ease: "power2.inOut" }, 7.35);
    tl.to("#ad-ring", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 7.35);

    // D · precio y botón (la última línea queda quieta más de 2 s)
    tl.fromTo(
      "#d-cur",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" },
      7.45,
    );
    tl.fromTo(
      "#d-num",
      { opacity: 0, filter: "blur(10px)", scale: 0.94 },
      { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.3, ease: "power4.out" },
      7.53,
    );
    tl.fromTo(
      "#d-cta",
      { opacity: 0, scale: 0.94, filter: "blur(8px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" },
      7.7,
    );
    tl.fromTo("#d-url", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.85);
    tl.to("#d-cta-sheen", { x: 800, duration: 0.6, ease: "power2.inOut" }, 8.9);

    window.__timelines["anuncio"] = tl;
  </script>
