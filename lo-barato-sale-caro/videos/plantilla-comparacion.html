    const hidden = { opacity: 0, filter: "blur(8px)" };

    tl.set(["#c-recA", "#c-recB"], { opacity: 1, clipPath: "inset(0 0 100% 0)" }, 0);
        tl.set("#c-strike", { scaleX: 0 }, 0);

    tl.fromTo("#c-ticker-row", { x: 0 }, { x: -1300, duration: 24.5, ease: "none" }, 0);

    tl.to("#c-hook > div", { ...OUT, stagger: 0.05 }, 2.35);

    // 2.6–5.8 s: precios arriba y la pregunta

    // 13.2–19.4 s: gráfico acumulado
