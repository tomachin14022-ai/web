<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0d1310;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 70% at 50% 40%,#18231d 0%,#0d1310 70%);font-family:Inter,sans-serif;color:#f2efe8}
  .panel{position:absolute;top:400px;height:960px;border-radius:28px;overflow:hidden}
  #left{left:40px;width:490px;background:#000}
  #left img{width:100%;height:100%;object-fit:cover}
  #right{left:550px;width:490px;background:linear-gradient(180deg,#1d2a23,#121a16)}
  #right canvas{display:block}
  .tag{position:absolute;top:18px;left:18px;font:800 22px Inter;letter-spacing:.08em;padding:8px 14px;border-radius:999px;background:rgba(13,19,16,.72)}
  .tag b{color:#c9f26b}
  #title{position:absolute;top:285px;left:60px;font:900 64px/1 Inter;letter-spacing:-.01em}
  #title span{color:#c9f26b}
  #phase{position:absolute;top:1385px;left:60px;font:900 54px/1 Inter;letter-spacing:.01em}
  #sub{position:absolute;top:1450px;left:60px;font:600 26px Inter;color:#b9c2bb}
  #bar{position:absolute;top:372px;left:60px;width:780px;height:6px;border-radius:3px;background:#2a3a31}
  #bar i{display:block;height:100%;width:0;border-radius:3px;background:#c9f26b}
</style></head>
<body>
<div id="stage">
  <div id="title">SWING <span>EN 3D</span> · PRUEBA</div>
  <div id="bar"><i></i></div>
  <div class="panel" id="left"><img id="vid"><div class="tag">VIDEO <b>REAL</b></div></div>
  <div class="panel" id="right"><div class="tag">MODELO <b>3D</b> · ESTIMADO</div></div>
  <div id="phase">ADDRESS</div>
  <div id="sub">Vista 3D girando hacia "de frente"</div>
</div>
<script type="importmap">{"imports":{"three":"/r3d/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
// Rutas por parametro: split.html?pose=/run/pose.json&metrics=/run/out/metrics.json&overlay=/run/out/overlay
const Q = new URLSearchParams(location.search);
const OVERLAY = Q.get('overlay') || '/test/out/overlay';
const pose = await (await fetch(Q.get('pose') || '/test/pose.json')).json();
const met = await (await fetch(Q.get('metrics') || '/test/out/metrics.json')).json();
const F = pose.frames, N = F.length, ev = met.eventos_cuadro;

// Suavizado (media movil de 5) de los landmarks 3D, y paso a ejes de Three (y arriba, z hacia la camara).
const raw = F.map(f => f.world.map(p => [p[0], -p[1], -p[2]]));
const W3 = raw.map((_, i) => raw[0].map((__, j) => {
  let s = [0,0,0], c = 0;
  for (let k = -2; k <= 2; k++) { const q = raw[Math.min(N-1, Math.max(0, i+k))][j]; s[0]+=q[0]; s[1]+=q[1]; s[2]+=q[2]; c++; }
  return new THREE.Vector3(s[0]/c, s[1]/c, s[2]/c);
}));
const floorY = Math.min(...[29,30,31,32].map(j => W3[ev.address][j].y));

const R = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
R.setPixelRatio(1); R.setSize(490, 960); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('right').prepend(R.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 490/960, 0.1, 50);
scene.add(new THREE.HemisphereLight(0xf2efe8, 0x22302a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera, {left:-2,right:2,top:2,bottom:-2}); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.6, 64), new THREE.MeshStandardMaterial({color:0x2c4a37, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = floorY - 0.02; ground.receiveShadow = true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(1.58, 1.62, 96), new THREE.MeshBasicMaterial({color:0xc9f26b}));
ring.rotation.x = -Math.PI/2; ring.position.y = floorY - 0.015; scene.add(ring);

const skin = new THREE.MeshStandardMaterial({color:0xe9e6dc, roughness:.55, metalness:.05});
const accent = new THREE.MeshStandardMaterial({color:0xc9f26b, roughness:.5});
const cyl = new THREE.CylinderGeometry(1,1,1,20), sph = new THREE.SphereGeometry(1, 24, 16);
const BONES = [[11,13,.045],[13,15,.04],[12,14,.045],[14,16,.04],[23,25,.07],[25,27,.055],[24,26,.07],[26,28,.055],[27,31,.035],[28,32,.035],[29,31,.03],[30,32,.03]];
const JOINTS = [[11,.06],[12,.06],[13,.045],[14,.045],[15,.04],[16,.04],[23,.075],[24,.075],[25,.06],[26,.06],[27,.05],[28,.05]];
const mk = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; scene.add(m); return m; };
const bones = BONES.map(() => mk(cyl, skin)), joints = JOINTS.map(([j]) => mk(sph, [15,16].includes(j) ? accent : skin));
const torso = mk(cyl, skin), pelvis = mk(sph, skin), head = mk(sph, skin), neck = mk(cyl, skin);
const up = new THREE.Vector3(0,1,0);
function place(m, a, b, r) {
  const d = b.clone().sub(a); m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(up, d.clone().normalize()); m.scale.set(r, d.length(), r);
}
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const PH = [[0,'ADDRESS'],[ev.address+3,'SUBIDA'],[ev.top-2,'TOPE'],[ev.top+4,'BAJADA'],[ev.impact-1,'IMPACTO'],[ev.impact+5,'FINAL']];
window.setFrame = async (i) => {
  const P = W3[i];
  BONES.forEach(([a,b,r], k) => place(bones[k], P[a], P[b], r));
  JOINTS.forEach(([j,r], k) => { joints[k].position.copy(P[j]); joints[k].scale.setScalar(r); });
  const sh = P[11].clone().add(P[12]).multiplyScalar(.5), hp = P[23].clone().add(P[24]).multiplyScalar(.5);
  place(torso, hp, sh, .13); torso.scale.x = .16; torso.scale.z = .09;
  // orientar el ancho del torso segun la linea de hombros
  const across = P[11].clone().sub(P[12]).normalize(), axis = sh.clone().sub(hp).normalize();
  const fwd = new THREE.Vector3().crossVectors(across, axis).normalize(), side = new THREE.Vector3().crossVectors(axis, fwd);
  torso.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(side, axis, fwd));
  pelvis.position.copy(hp); pelvis.scale.set(.15,.1,.1); pelvis.quaternion.copy(torso.quaternion);
  const ears = P[7].clone().add(P[8]).multiplyScalar(.5);
  head.position.copy(ears); head.scale.set(.1,.12,.1);
  place(neck, sh, ears, .045);
  // camara: arranca como el video y gira hasta verlo de frente
  const t = ease(Math.min(1, Math.max(0, (i - 30) / 150))), th = t * Math.PI/2, d = 4.6;
  cam.position.set(d*Math.sin(th), .35, d*Math.cos(th)); cam.lookAt(0, -.05, 0);
  R.render(scene, cam);
  document.getElementById('vid').src = `${OVERLAY}/${String(i).padStart(4,'0')}.png`;
  await document.getElementById('vid').decode();
  document.getElementById('phase').textContent = PH.filter(p => i >= p[0]).pop()[1];
  document.querySelector('#bar i').style.width = (100*i/(N-1)) + '%';
};
// recorte del video centrado en la cadera promedio del golfista
const hx = F.reduce((s,f) => s + (f.lm[23][0]+f.lm[24][0])/2, 0) / N;
document.getElementById('vid').style.objectPosition = `${(hx*100).toFixed(1)}% 50%`;
window.N = N; window.ready = true;
</script>
</body></html>
